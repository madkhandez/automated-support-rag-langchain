[project]
name = "production-rag"
version = "1.0.0"
description = "Production RAG with LangChain & Vector Databases - Complete Course Project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langsmith>=0.2.0",
    "chromadb>=0.5.0",
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.38.0",
    "supabase>=2.7.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
    "tiktoken>=0.7.0",
    "pypdf>=4.3.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "fpdf2>=2.7.0",
    "Pillow>=10.4.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["part*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
